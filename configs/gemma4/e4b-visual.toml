# Gemma 4 E4B backend for the VISUAL caption track (frame input). Runtime and
# hardware concerns only — every result-affecting hyperparameter (learning
# rates, epochs, batch geometry, LoRA topology, seeds, precision) lives in the
# study contract, which pins this file's hash for provenance.
# Hardware target: one RTX 3090 (24 GB).
#
# One checkpoint serves both tracks, so a study declaring both runs a single
# seed model and a cross-track difference cannot be confounded with model
# identity. Measured on six clips at the two-frame budget: E4B satisfies the
# contract's scene-changes clause, reporting the transition between the two
# sampled frames, and carries a 169.3M vision tower.
#
# bf16 to match the audio backend. The visual track captions correctly under
# nf4 too, but running the two tracks at different precisions would reintroduce
# exactly the asymmetry the shared checkpoint is here to remove.
#
# Training budget, measured on one RTX 3090 at the contract's batch_size = 4
# with video_frames = 2: every preference arm peaks at 18.62 GiB — below the
# audio track's 20.85 GiB, because two frames are 140 soft tokens while the
# audio tower emits more for a 10.5 s clip. Four frames is unmeasured here.

[model]
model_id = "google/gemma-4-E4B-it"
revision = "a4c2d58be94dda072b918d9db64ee85c8ed34e3f"
media_inputs = "visual"

[quantization]
# Inert while load_in_4bit is false; kept so flipping it back needs no other edit.
load_in_4bit = false
quant_type = "nf4"
double_quant = true
compute_dtype = "bfloat16"

[runtime]
gradient_checkpointing = true
