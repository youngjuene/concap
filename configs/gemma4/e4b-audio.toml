# Gemma 4 E4B backend for the AUDIO caption track (audio tower input). Runtime
# and hardware concerns only — every result-affecting hyperparameter (learning
# rates, epochs, batch geometry, LoRA topology, seeds, precision) lives in the
# study contract, which pins this file's hash for provenance.
# Hardware target: one RTX 3090 (24 GB), QLoRA.
#
# WHY THIS CHECKPOINT. At our VRAM budget both Gemma 4 E4B and 12B were live
# options — 12B fits one 24 GB card under nf4 QLoRA — so this was not a memory
# decision. 12B was ruled out on capability: its audio encoder accepts only
# speech-like input (published on FLEURS ASR and CoVoST, speech only), and on
# environmental street recordings it hallucinated speech for every clip. That
# is total failure at the sound-event captioning this track exists to do, so
# E4B serves audio and visual alike.

[model]
model_id = "google/gemma-4-E4B-it"
revision = "a4c2d58be94dda072b918d9db64ee85c8ed34e3f"
media_inputs = "audio"

# MEASURED, UNRESOLVED: nf4 destroys this model's audio captioning. On real
# 10.5 s street recordings and on synthetic textures with known ground truth,
# 4-bit E4B answers almost every clip with the same boilerplate ("a continuous,
# loud burst of static or noise with no discernible events or setting"), and
# describes its own input as "repeated, unintelligible characters". The cause
# is not the staging or the tower:
#   - the processor's input_features are well-scaled and distinct per clip
#     (mean -1.8 vs -2.8, std ~1.0; nothing truncated or saturated),
#   - level and duration are irrelevant (peak-normalising and trimming to 4 s
#     change nothing), and so is the prompt (four rewordings, all degenerate),
#   - leaving the audio tower in bf16 via llm_int8_skip_modules changes nothing,
#     so it is the quantised LANGUAGE MODEL that cannot read the audio tokens.
# Unquantised bf16 E4B fixes it outright at 14.8 GiB resident: white noise ->
# "heavy rain falling", a tremolo tone -> "a bell", and an Amsterdam square ->
# "a group of people gathered outdoors, likely at a public event, with some
# talking and moving around".
#
# Flipping load_in_4bit to false is the only known working audio configuration.
# It is now expressible — backend_config.py no longer requires 4-bit, and the
# bf16 path is verified end to end (14.8 GiB, all-bfloat16 params, base frozen,
# checkpointing armed). The 24 GB training budget was re-measured against this
# unquantized base, because the original matrix assumed a 4-bit one: on one
# RTX 3090, at the contract's batch_size = 4, every preference arm (DPO, IPO,
# CDPO, RDPO, DRDPO, WDPO, SFT_DPO) trains at a 20.85 GiB peak — identical
# across arms, since they share one memory shape and differ only in the loss.
# Peak does not grow with pool size (media batches carry clip identity only and
# completion_logps scores row by row), so it is set by batch_size and sequence
# length alone. Roughly 2.7 GiB of headroom: raising batch_size is not free.
[quantization]
# Deliberately unquantized: see the measurement above. quant_type and
# double_quant are inert while load_in_4bit is false, and are kept only so
# flipping it back needs no other edit.
load_in_4bit = false
quant_type = "nf4"
double_quant = true
compute_dtype = "bfloat16"

[runtime]
gradient_checkpointing = true
