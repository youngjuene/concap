# RETIRED as of 2026-07-30: the live contract pins e4b-visual.toml instead, so
# one checkpoint serves both tracks and cross-track differences cannot be
# confounded with model identity. Kept because it is a valid backend and the
# only 12B pin we have. Do not reach for it on the audio track — 12B is
# encoder-free with a 2.5M raw-waveform audio path trained on speech, and it
# hallucinates speech on non-speech audio at every precision; see
# configs/gemma4/e4b-audio.toml for the measurement.
#
# Gemma 4 12B backend for the VISUAL caption track (frame input). Runtime and
# hardware concerns only — every result-affecting hyperparameter (learning
# rates, epochs, batch geometry, LoRA topology, seeds, precision) lives in the
# study contract, which pins this file's hash for provenance.
# Hardware target: one RTX 3090 (24 GB), QLoRA.

[model]
model_id = "google/gemma-4-12B-it"
revision = "0e2b1058541244490925fbacf8972041435691ac"
media_inputs = "visual"

[quantization]
load_in_4bit = true
quant_type = "nf4"
double_quant = true
compute_dtype = "bfloat16"

[runtime]
gradient_checkpointing = true
