[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dpo"
version = "0.2.0"
description = "Preference-alignment pipeline for modality-specific video captions (SEED, SFT, DPO, IPO, CDPO, RDPO, DRDPO, WDPO, SFT_DPO)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  # accelerate is required by transformers' device_map loading path.
  "accelerate==1.14.0",
  "av>=18.0.0",
  "bitsandbytes==0.49.2",
  "fastapi>=0.139.2",
  "librosa>=0.11.0",
  "peft==0.19.1",
  "pillow>=12.3.0",
  "safetensors>=0.6.2",
  "torch==2.10.0",
  "torchvision>=0.25.0",
  # `dpo regen serve` draws §6 on the operator's console. It arrives with
  # transformers either way; named here because this package imports it.
  "tqdm>=4.67.0",
  "transformers==5.13.1",
  "uvicorn[standard]>=0.51.0",
]

[project.scripts]
dpo = "dpo.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "ruff>=0.12",
  # tqdm ships no py.typed; `dpo regen serve` imports it under --strict.
  "types-tqdm>=4.67",
]

[tool.uv]
required-version = ">=0.11.0"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.hatch.build.targets.wheel]
packages = ["src/dpo"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["live: requires model downloads and a CUDA GPU"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
# scripts/ is on the pilot's critical path (docs/shared/study-runbook.md stages
# the served renders with stage_media.py), so it is checked too. `files` rather
# than `packages` because scripts/ is not one.
files = ["src/dpo", "scripts"]

# regenerate_golden.py imports the test fixtures to build the golden snapshot,
# which would otherwise put tests/conftest.py alone under --strict while the
# rest of tests/ stays out. Follow it for names, do not check it.
[[tool.mypy.overrides]]
module = ["tests.*"]
follow_imports = "silent"
